on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

name: ci-tag

jobs:

  # Delegate building to a single workflow.
  build:
    uses: ./.github/workflows/ci-build.yml

  # Build module base for release assets
  build-module-base:
    uses: ./.github/workflows/build-module-base.yml
    secrets: inherit

  # Create a draft GitHub release; RC tags are marked as pre-release
  release:
    needs: [build, build-module-base]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenShock_Desktop_Setup
          path: artifacts/

      - name: Download Linux build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenShock Desktop Linux
          path: artifacts/linux/

      - name: Download Linux AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenShock Desktop AppImage
          path: artifacts/

      - name: Download Module Base
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: OpenShock Desktop Module Base
          path: artifacts/module-base/

      - name: Package release assets
        run: |
          cd artifacts/linux && zip -r ../OpenShock.Desktop.Linux.zip . && cd ../..
          cd artifacts/module-base && zip -r ../OpenShock.Desktop.Module.Base.zip . && cd ../..

      - name: Create release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc.') }}
          generate_release_notes: true
          files: |
            artifacts/OpenShock_Desktop_Setup.exe
            artifacts/OpenShock.Desktop.Linux.zip
            artifacts/OpenShock_Desktop-*.AppImage
            artifacts/OpenShock.Desktop.Module.Base.zip
