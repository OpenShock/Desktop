on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
    types: [opened, reopened, synchronize]
  workflow_call:
  workflow_dispatch:

name: build-module-base

env:
  DOTNET_VERSION: 10.0.x
  REGISTRY: ghcr.io

jobs:

  check-host-deps:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check host dependency list is in sync
        run: bash scripts/sync-host-deps.sh

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET SDK ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: module-base-nuget
          restore-keys: |
            module-base-nuget-

      - name: Publish OpenShock Desktop Module Base
        run: dotnet build ModuleBase/ModuleBase.csproj -c Release -o ./publish/ModuleBase

      - name: Upload OpenShock Desktop Module Base artifacts
        uses: actions/upload-artifact@v6
        with:
          name: OpenShock Desktop Module Base
          path: ./publish/ModuleBase/**
          retention-days: 1
          if-no-files-found: error